# Versiones de escritorio (Windows y Mac) de las apps de Sampled Head (el portal SH-apps se queda solo como web).
# - Se ejecuta al cambiar desktop/, cada lunes (para recoger las novedades de cada app) o a mano en Actions → desktop → Run workflow.
# - Descarga cada app de su repositorio, la empaqueta con el envoltorio de desktop/app y publica los instaladores
#   en Releases (etiqueta escritorio-vX.Y.Z). Las apps cuyo repositorio no exista todavía se saltan con un aviso.
# - Windows y Mac van por separado: cada uno publica en cuanto termina, sin esperar al otro.
name: desktop

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps a compilar (ids separados por comas; vacío = todas). Ej.: tuner,fuzzhead"
        required: false
        default: ""
      sistemas:
        description: "Sistemas: windows, mac o ambos"
        type: choice
        options: [ambos, windows, mac]
        default: ambos
      publicar:
        description: "Publicar los instaladores en Releases"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
      version: ${{ steps.m.outputs.version }}
      windows: ${{ steps.m.outputs.windows }}
      mac: ${{ steps.m.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          APPS: ${{ github.event.inputs.apps }}
          SIS: ${{ github.event.inputs.sistemas || 'ambos' }}
        run: |
          node -e '
            const l = require("./desktop/apps.json");
            const want = (process.env.APPS || "").split(",").map(s => s.trim()).filter(Boolean);
            const apps = l.apps.filter(a => !want.length || want.includes(a.id)).map(a => ({ id: a.id, repo: a.repo }));
            const s = process.env.SIS;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              "apps=" + JSON.stringify(apps) + "\nversion=" + l.wrapperVersion +
              "\nwindows=" + (s !== "mac") + "\nmac=" + (s !== "windows") + "\n");
          '

  build-windows:
    needs: setup
    if: needs.setup.outputs.windows == 'true'
    name: Windows · ${{ matrix.app.id }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar la app
        id: src
        run: |
          if git clone --depth 1 "https://github.com/sampledhead-dot/${{ matrix.app.repo }}.git" "$RUNNER_TEMP/src"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app.id }}::El repositorio ${{ matrix.app.repo }} no existe o no es accesible; se salta."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar herramientas
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: node scripts/prepare.js "${{ matrix.app.id }}" "$RUNNER_TEMP/src" "build/${{ matrix.app.id }}"
      - name: Empaquetar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: |
          npx electron-builder --projectDir "build/${{ matrix.app.id }}" --win --publish never
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: ${{ matrix.app.id }}-windows
          path: |
            desktop/build/${{ matrix.app.id }}/dist/*.exe
            desktop/build/${{ matrix.app.id }}/dist/*.dmg
          if-no-files-found: error

  build-mac:
    needs: setup
    if: needs.setup.outputs.mac == 'true'
    name: Mac · ${{ matrix.app.id }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar la app
        id: src
        run: |
          if git clone --depth 1 "https://github.com/sampledhead-dot/${{ matrix.app.repo }}.git" "$RUNNER_TEMP/src"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app.id }}::El repositorio ${{ matrix.app.repo }} no existe o no es accesible; se salta."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar herramientas
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: node scripts/prepare.js "${{ matrix.app.id }}" "$RUNNER_TEMP/src" "build/${{ matrix.app.id }}"
      - name: Empaquetar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: |
          # firma ad-hoc (sin certificado de Apple); si falla, sin firma
          npx electron-builder --projectDir "build/${{ matrix.app.id }}" --mac --publish never \
            || npx electron-builder --projectDir "build/${{ matrix.app.id }}" --mac --publish never -c.mac.identity=null
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: ${{ matrix.app.id }}-mac
          path: |
            desktop/build/${{ matrix.app.id }}/dist/*.exe
            desktop/build/${{ matrix.app.id }}/dist/*.dmg
          if-no-files-found: error

  release-windows:
    needs: [setup, build-windows]
    # no publica si la ejecución se cancela; sí aunque falle alguna app suelta
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.windows == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publicar == 'true') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: escritorio-v${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-windows"
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        run: bash repo/desktop/scripts/release.sh "*.exe"

  release-mac:
    needs: [setup, build-mac]
    # no publica si la ejecución se cancela; sí aunque falle alguna app suelta
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.mac == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publicar == 'true') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: escritorio-v${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-mac"
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        run: bash repo/desktop/scripts/release.sh "*.dmg"
