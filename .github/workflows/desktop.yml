# Versiones Windows, Mac y Android de las apps de Sampled Head (el portal SH-apps es solo web: no está en la lista).
# - Se ejecuta al cambiar desktop/ o android/, cada lunes (recoge las novedades de cada app) o a mano en
#   Actions → apps → Run workflow (se puede elegir apps y sistemas).
# - Descarga cada app de su repositorio, la empaqueta y publica todo en una sola release (apps-vX.Y.Z).
# - Mac se compila en máquinas Linux (GitHub no asigna máquinas Mac a esta cuenta): .zip para Apple Silicon e Intel,
#   firmados ad-hoc con rcodesign.
# - Android: APK firmado con la clave de los secretos SH_ANDROID_KEYSTORE / SH_ANDROID_PASSWORD si existen;
#   si no, con la clave provisional de android/keystore/.
name: apps

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps a compilar (ids separados por comas; vacío = todas). Ej.: tuner,fuzzhead"
        required: false
        default: ""
      sistemas:
        description: "Sistemas"
        type: choice
        options: [todos, windows, mac, android]
        default: todos
      publicar:
        description: "Publicar los instaladores en Releases"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["desktop/**", "android/**", ".github/workflows/desktop.yml"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
      desk: ${{ steps.m.outputs.desk }}
      suite: ${{ steps.m.outputs.suite }}
      version: ${{ steps.m.outputs.version }}
      windows: ${{ steps.m.outputs.windows }}
      mac: ${{ steps.m.outputs.mac }}
      android: ${{ steps.m.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          APPS: ${{ github.event.inputs.apps }}
          SIS: ${{ github.event.inputs.sistemas || 'todos' }}
        run: |
          node -e '
            const l = require("./desktop/apps.json");
            const want = (process.env.APPS || "").split(",").map(s => s.trim()).filter(Boolean);
            const pl = a => a.platforms || ["windows", "mac", "android"];
            const sel = l.apps.filter(a => !want.length || want.includes(a.id));
            const apps = sel.filter(a => pl(a).includes("android")).map(a => ({ id: a.id, repo: a.repo }));            // Android
            const desk = sel.filter(a => pl(a).some(p => p === "windows" || p === "mac")).map(a => ({ id: a.id, repo: a.repo }));   // Windows y Mac
            const suite = !want.length || want.includes("suite");                                                        // plataforma única
            const s = process.env.SIS;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              "apps=" + JSON.stringify(apps) + "\ndesk=" + JSON.stringify(desk.length ? desk : [{ id: "-", repo: "-" }]) + "\ndeskn=" + desk.length +
              "\nsuite=" + suite + "\nversion=" + l.wrapperVersion +
              "\nwindows=" + (s === "todos" || s === "windows") + "\nmac=" + (s === "todos" || s === "mac") +
              "\nandroid=" + (s === "todos" || s === "android") + "\n");
          '

  build-windows:
    needs: setup
    if: needs.setup.outputs.windows == 'true'
    name: Windows · ${{ matrix.app.id }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.desk) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar la app
        id: src
        run: |
          if [ "${{ matrix.app.id }}" = "-" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git clone --depth 1 "https://github.com/sampledhead-dot/${{ matrix.app.repo }}.git" "$RUNNER_TEMP/src"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app.id }}::El repositorio ${{ matrix.app.repo }} no existe o no es accesible; se salta."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar herramientas
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: node scripts/prepare.js "${{ matrix.app.id }}" "$RUNNER_TEMP/src" "build/${{ matrix.app.id }}"
      - name: Empaquetar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: npx electron-builder --projectDir "build/${{ matrix.app.id }}" --win --publish never
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: ${{ matrix.app.id }}-windows
          path: desktop/build/${{ matrix.app.id }}/dist/*.exe
          if-no-files-found: error

  build-mac:
    needs: setup
    if: needs.setup.outputs.mac == 'true'
    name: Mac · ${{ matrix.app.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.desk) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar la app
        id: src
        run: |
          if [ "${{ matrix.app.id }}" = "-" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git clone --depth 1 "https://github.com/sampledhead-dot/${{ matrix.app.repo }}.git" "$RUNNER_TEMP/src"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app.id }}::El repositorio ${{ matrix.app.repo }} no existe o no es accesible; se salta."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar rcodesign (firma ad-hoc para Mac desde Linux)
        if: steps.src.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R indygreg/apple-platform-rs --limit 50 --json tagName --jq '[.[]|select(.tagName|startswith("apple-codesign/"))][0].tagName')
          mkdir -p "$RUNNER_TEMP/rc"
          gh release download "$TAG" -R indygreg/apple-platform-rs --pattern '*x86_64-unknown-linux-musl.tar.gz' -D "$RUNNER_TEMP/rc"
          tar xzf "$RUNNER_TEMP"/rc/*.tar.gz -C "$RUNNER_TEMP/rc"
          sudo install "$(find "$RUNNER_TEMP/rc" -name rcodesign -type f | head -1)" /usr/local/bin/rcodesign
          rcodesign --version
      - name: Instalar herramientas
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: node scripts/prepare.js "${{ matrix.app.id }}" "$RUNNER_TEMP/src" "build/${{ matrix.app.id }}"
      - name: Empaquetar (Apple Silicon e Intel)
        if: steps.src.outputs.ok == 'true'
        working-directory: desktop
        run: bash scripts/mac-zip.sh "${{ matrix.app.id }}"
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: ${{ matrix.app.id }}-mac
          path: desktop/build/${{ matrix.app.id }}/dist/*.zip
          if-no-files-found: error

  # Plataforma única SampledHead (todas las apps de Windows/Mac en un solo programa)
  build-suite-windows:
    needs: setup
    if: needs.setup.outputs.windows == 'true' && needs.setup.outputs.suite == 'true'
    name: Windows · SampledHead (plataforma)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar las apps
        run: bash desktop/scripts/clone-all.sh "$RUNNER_TEMP/srcs"
      - name: Instalar herramientas
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        working-directory: desktop
        run: node scripts/prepare-suite.js "$RUNNER_TEMP/srcs" build/suite
      - name: Empaquetar
        working-directory: desktop
        run: npx electron-builder --projectDir build/suite --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: suite-windows
          path: desktop/build/suite/dist/*.exe
          if-no-files-found: error

  build-suite-mac:
    needs: setup
    if: needs.setup.outputs.mac == 'true' && needs.setup.outputs.suite == 'true'
    name: Mac · SampledHead (plataforma)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar las apps
        run: bash desktop/scripts/clone-all.sh "$RUNNER_TEMP/srcs"
      - name: Instalar rcodesign (firma ad-hoc para Mac desde Linux)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R indygreg/apple-platform-rs --limit 50 --json tagName --jq '[.[]|select(.tagName|startswith("apple-codesign/"))][0].tagName')
          mkdir -p "$RUNNER_TEMP/rc"
          gh release download "$TAG" -R indygreg/apple-platform-rs --pattern '*x86_64-unknown-linux-musl.tar.gz' -D "$RUNNER_TEMP/rc"
          tar xzf "$RUNNER_TEMP"/rc/*.tar.gz -C "$RUNNER_TEMP/rc"
          sudo install "$(find "$RUNNER_TEMP/rc" -name rcodesign -type f | head -1)" /usr/local/bin/rcodesign
      - name: Instalar herramientas
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Preparar
        working-directory: desktop
        run: node scripts/prepare-suite.js "$RUNNER_TEMP/srcs" build/suite
      - name: Autoprueba (Linux + Xvfb)
        working-directory: desktop
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null || true
          MACV=$(node -p "require('./apps.json').electronVersionMac||''")   # probar con la misma Electron que lleva el Mac
          npx electron-builder --projectDir build/suite --linux dir --publish never ${MACV:+-c.electronVersion=$MACV} >/dev/null
          SH_SHARED_DIR="$RUNNER_TEMP/shs" SH_SELFTEST="$RUNNER_TEMP/suite.json" timeout 300 xvfb-run -a build/suite/dist/linux-unpacked/sampledhead --no-sandbox || true
          cat "$RUNNER_TEMP/suite.json" | head -c 4000 || true
          node -e 'const d=require(process.env.RUNNER_TEMP+"/suite.json");if(!d.ok){console.log("::warning title=SampledHead::La autoprueba no ha salido bien");}'
      - name: Empaquetar (Apple Silicon e Intel)
        working-directory: desktop
        run: bash scripts/mac-zip.sh suite
      - uses: actions/upload-artifact@v4
        with:
          name: suite-mac
          path: desktop/build/suite/dist/*.zip
          if-no-files-found: error

  build-android:
    needs: setup
    if: needs.setup.outputs.android == 'true'
    name: Android · ${{ matrix.app.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar la app
        id: src
        run: |
          if [ "${{ matrix.app.id }}" = "-" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git clone --depth 1 "https://github.com/sampledhead-dot/${{ matrix.app.repo }}.git" "$RUNNER_TEMP/src"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app.id }}::El repositorio ${{ matrix.app.repo }} no existe o no es accesible; se salta."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.src.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Android
        if: steps.src.outputs.ok == 'true'
        run: node android/scripts/prepare.js "${{ matrix.app.id }}" "$RUNNER_TEMP/src" "$RUNNER_TEMP/android" "$((1000000 + ${{ github.run_number }}))"
      - name: Clave de firma
        if: steps.src.outputs.ok == 'true'
        env:
          KS: ${{ secrets.SH_ANDROID_KEYSTORE }}
          PW: ${{ secrets.SH_ANDROID_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            # Se limpian espacios y saltos de línea que se cuelan al copiar y pegar los secretos.
            PW="$(printf '%s' "$PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            printf '%s' "$KS" | tr -d '[:space:]' > "$RUNNER_TEMP/ks.b64"
            echo "Diagnóstico (sin revelar los secretos): texto de la clave ${#KS} caracteres -> $(wc -c < "$RUNNER_TEMP/ks.b64") sin espacios (debe ser 5764) · contraseña ${#PW} caracteres (debe ser 28)"
            if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/ks.jks" 2>/dev/null; then
              echo "::error title=Clave Android::SH_ANDROID_KEYSTORE no es un texto base64 válido. Pega TODO el contenido de SH_ANDROID_KEYSTORE.txt (una sola línea de 5764 caracteres, termina en «xA=»). ¿Están los dos secretos intercambiados?"; exit 1
            fi
            echo "Huella del archivo de clave: $(sha256sum "$RUNNER_TEMP/ks.jks" | cut -c1-16) (la correcta empieza por 2e139c92a9ff43e8)"
            if ! keytool -list -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -storepass "$PW" -alias sampledhead >/dev/null 2>&1; then
              echo "::error title=Clave Android::La clave no se abre con SH_ANDROID_PASSWORD. Revisa que la contraseña sea exactamente el contenido de SH_ANDROID_PASSWORD.txt (28 caracteres) y que SH_ANDROID_KEYSTORE sea el de SH_ANDROID_KEYSTORE.txt completo."; exit 1
            fi
            echo "SH_KEYSTORE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"; echo "SH_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "Firmado con la clave permanente (secretos): $(keytool -list -v -keystore "$RUNNER_TEMP/ks.jks" -storepass "$PW" -alias sampledhead 2>/dev/null | grep 'SHA256:' | head -1 | xargs)"
          else
            echo "::warning title=Android::Sin los secretos SH_ANDROID_KEYSTORE/SH_ANDROID_PASSWORD: se firma con la clave PROVISIONAL."
            echo "SH_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/provisional.jks" >> "$GITHUB_ENV"; echo "SH_KEYSTORE_PASSWORD=sampledhead-provisional" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        if: steps.src.outputs.ok == 'true'
        working-directory: ${{ runner.temp }}/android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon -q && break || { echo "Reintento $i"; sleep 20; }; done
          ART=$(node -e 'const l=require(process.env.GITHUB_WORKSPACE+"/desktop/apps.json");const a=l.apps.find(x=>x.id===process.argv[1]);console.log(a.productName.replace(/[^A-Za-z0-9]+/g,"-")+"-"+(l.androidVersion||l.wrapperVersion))' "${{ matrix.app.id }}")
          mkdir -p "$GITHUB_WORKSPACE/out-android"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out-android/$ART-Android.apk"
          # Copia con el nombre visible (p. ej. «Pop-Pads-…» para «Pop!Pads»): los APK v1.1.1 y anteriores lo buscan así
          # y, si no lo encuentran, abren la página de GitHub en vez de descargarlo.
          OLD=$(node -e 'const l=require(process.env.GITHUB_WORKSPACE+"/desktop/apps.json");const a=l.apps.find(x=>x.id===process.argv[1]);console.log(a.name.replace(/[^A-Za-z0-9]+/g,"-")+"-"+(l.androidVersion||l.wrapperVersion))' "${{ matrix.app.id }}")
          if [ "$OLD" != "$ART" ]; then cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out-android/$OLD-Android.apk"; fi
          ls -la "$GITHUB_WORKSPACE/out-android"
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: ${{ matrix.app.id }}-android
          path: out-android/*.apk
          if-no-files-found: error

  build-android-suite:
    # App única «SampledHead» para Android: todas las apps dentro (menos Pop!Pads), como la plataforma de Windows y Mac
    needs: setup
    if: needs.setup.outputs.android == 'true' && needs.setup.outputs.suite == 'true'
    name: Android · SampledHead (app única)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar las apps
        run: bash desktop/scripts/clone-all.sh "$RUNNER_TEMP/srcs"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Android
        run: node android/scripts/prepare-suite.js "$RUNNER_TEMP/srcs" "$RUNNER_TEMP/android" "$((1000000 + ${{ github.run_number }}))"
      - name: Clave de firma
        env:
          KS: ${{ secrets.SH_ANDROID_KEYSTORE }}
          PW: ${{ secrets.SH_ANDROID_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            # Se limpian espacios y saltos de línea que se cuelan al copiar y pegar los secretos.
            PW="$(printf '%s' "$PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            printf '%s' "$KS" | tr -d '[:space:]' > "$RUNNER_TEMP/ks.b64"
            echo "Diagnóstico (sin revelar los secretos): texto de la clave ${#KS} caracteres -> $(wc -c < "$RUNNER_TEMP/ks.b64") sin espacios (debe ser 5764) · contraseña ${#PW} caracteres (debe ser 28)"
            if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/ks.jks" 2>/dev/null; then
              echo "::error title=Clave Android::SH_ANDROID_KEYSTORE no es un texto base64 válido. Pega TODO el contenido de SH_ANDROID_KEYSTORE.txt (una sola línea de 5764 caracteres, termina en «xA=»). ¿Están los dos secretos intercambiados?"; exit 1
            fi
            echo "Huella del archivo de clave: $(sha256sum "$RUNNER_TEMP/ks.jks" | cut -c1-16) (la correcta empieza por 2e139c92a9ff43e8)"
            if ! keytool -list -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -storepass "$PW" -alias sampledhead >/dev/null 2>&1; then
              echo "::error title=Clave Android::La clave no se abre con SH_ANDROID_PASSWORD. Revisa que la contraseña sea exactamente el contenido de SH_ANDROID_PASSWORD.txt (28 caracteres) y que SH_ANDROID_KEYSTORE sea el de SH_ANDROID_KEYSTORE.txt completo."; exit 1
            fi
            echo "SH_KEYSTORE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"; echo "SH_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "Firmado con la clave permanente (secretos): $(keytool -list -v -keystore "$RUNNER_TEMP/ks.jks" -storepass "$PW" -alias sampledhead 2>/dev/null | grep 'SHA256:' | head -1 | xargs)"
          else
            echo "::warning title=Android::Sin los secretos SH_ANDROID_KEYSTORE/SH_ANDROID_PASSWORD: se firma con la clave PROVISIONAL."
            echo "SH_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/provisional.jks" >> "$GITHUB_ENV"; echo "SH_KEYSTORE_PASSWORD=sampledhead-provisional" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        working-directory: ${{ runner.temp }}/android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon -q && break || { echo "Reintento $i"; sleep 20; }; done
          V=$(node -e 'const l=require(process.env.GITHUB_WORKSPACE+"/desktop/apps.json");console.log(l.androidVersion||l.wrapperVersion)')
          mkdir -p "$GITHUB_WORKSPACE/out-android"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out-android/SampledHead-$V-Android.apk"
          ls -la "$GITHUB_WORKSPACE/out-android"
      - uses: actions/upload-artifact@v4
        with:
          name: suite-android
          path: out-android/*.apk
          if-no-files-found: error

  release-windows:
    needs: [setup, build-windows, build-suite-windows]
    # no publica si la ejecución se cancela; sí aunque falle alguna app suelta
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.windows == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publicar == 'true') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: apps-v${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-windows"
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        run: bash repo/desktop/scripts/release.sh "*.exe"

  release-mac:
    needs: [setup, build-mac, build-suite-mac]
    # no publica si la ejecución se cancela; sí aunque falle alguna app suelta
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.mac == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publicar == 'true') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: apps-v${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-mac"
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        run: bash repo/desktop/scripts/release.sh "*.zip"

  release-android:
    needs: [setup, build-android, build-android-suite]
    # no publica si la ejecución se cancela; sí aunque falle alguna app suelta
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.android == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publicar == 'true') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: apps-v${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-android"
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        run: bash repo/desktop/scripts/release.sh "*.apk"
