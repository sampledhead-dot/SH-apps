<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>asa</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#h{position:absolute;left:0;top:0;width:18px;height:64px;border:0;padding:0;cursor:pointer;background:#d65f00;border-radius:0 12px 12px 0;box-shadow:2px 2px 0 #111;color:#fff;font:900 9px system-ui;writing-mode:vertical-rl;letter-spacing:.08em;opacity:.55;transition:opacity .15s,width .15s}
#h:hover,#h:focus-visible{opacity:1;outline:none}
#c{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;opacity:0;transition:opacity .16s}
#c.on{display:flex}#c.vis{opacity:1}
#c img{width:96px;height:96px;border-radius:22px;border:4px solid #111;box-shadow:6px 6px 0 #111;background:#fff;transform:scale(.9);transition:transform .2s}
#c.vis img{transform:scale(1)}
#c b{font-size:22px;color:#fff;text-shadow:2px 2px 0 #111}
</style></head>
<body>
<button id="h" title="Volver al inicio de SampledHead (Ctrl/Cmd+0)" aria-label="Volver al inicio de SampledHead">SH</button>
<div id="c"><img id="ci" alt=""><b id="cn"></b></div>
<script>
const h = document.getElementById('h'), c = document.getElementById('c');
h.onclick = () => shHome.home();
shHome.on('curtain', d => {
  if (!d) { c.classList.remove('vis'); setTimeout(() => { c.classList.remove('on'); h.style.display = ''; }, 160); return; }
  h.style.display = 'none'; c.style.background = d.color || '#d65f00';
  document.getElementById('ci').src = d.icon; document.getElementById('cn').textContent = d.name;
  c.classList.add('on'); requestAnimationFrame(() => c.classList.add('vis'));
});
</script>
</body></html>
